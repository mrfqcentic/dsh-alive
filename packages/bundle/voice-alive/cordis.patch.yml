# The voice panel layer over `dsh-base`.
#
# One row, inserted after the base tree: the package is dual-face, so the same
# row mounts the Host daemon and appears in the browser roster through its
# `dsh.client` declaration. The panel document at
# `@deepseek-ai/dsh-voice-alive/panel/panel.html` boots that client half; the
# main chat surface mounts it too but the client plugin stays inert unless the
# document marks itself as the panel.
- insert:
    - id: voice-alive
      name: '@deepseek-ai/dsh-voice-alive'

# Privacy: this layer carries no outbound telemetry. These overrides disable
# the rows `dsh-base` and `dsh-web-app` insert, including the Desktop-only
# product analytics pair, whichever profile orders the layers. A disabled row
# never starts a fiber, so no collector, exporter, or analytics client exists in
# the composed tree. A later layer can still address the same ids; the last
# write wins, as for every other row.
- id: otel
  disabled: true
- id: session-telemetry-otel
  disabled: true
- id: desktop-product-telemetry
  disabled: true
- id: product-analytics
  disabled: true
